<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3K+ 词汇测验小游戏</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .game-container {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 32px 28px;
            transition: all 0.3s;
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            color: #1e3c72;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .subtitle {
            text-align: center;
            color: #5a6a7a;
            font-size: 0.9rem;
            margin-bottom: 24px;
            border-bottom: 1px solid #e6edf4;
            padding-bottom: 16px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: #f0f7ff;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 28px;
            font-weight: 600;
            color: #1e3c72;
            font-size: 0.95rem;
        }
        .stats-bar span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .question-word {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            color: #0b1e33;
            margin: 16px 0 8px;
            word-break: break-word;
            line-height: 1.2;
        }
        .question-meta {
            text-align: center;
            font-size: 1rem;
            color: #4b6a8b;
            background: #eef4fa;
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            margin: 0 auto 28px;
            letter-spacing: 0.3px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #d0ddee;
            border-radius: 18px;
            padding: 18px 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #1e2f44;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            word-break: break-word;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .option-btn:hover:not(:disabled) {
            background: #f5f9ff;
            border-color: #7fa9d9;
            transform: scale(1.01);
        }
        .option-btn.correct {
            background: #d4f5e0;
            border-color: #2b8c4a;
            color: #0a4620;
            font-weight: 600;
        }
        .option-btn.wrong {
            background: #ffe1e1;
            border-color: #c23b3b;
            color: #751d1d;
        }
        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }
        .feedback-msg {
            text-align: center;
            font-size: 1.1rem;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 22px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .feedback-correct {
            background: #e1f7e8;
            color: #166b33;
        }
        .feedback-wrong {
            background: #ffe9e9;
            color: #a12828;
        }
        .next-btn {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 16px 28px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 16px rgba(30, 60, 114, 0.3);
            margin-top: 8px;
        }
        .next-btn:hover:not(:disabled) {
            background: #0f2a4f;
            transform: scale(1.01);
        }
        .next-btn:disabled {
            background: #a0b8d0;
            box-shadow: none;
            cursor: not-allowed;
        }
        .restart-btn {
            background: transparent;
            border: 2px solid #b8cde0;
            color: #1e3c72;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 60px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-weight: 500;
            transition: 0.2s;
        }
        .restart-btn:hover {
            background: #edf4fa;
            border-color: #7fa9d9;
        }
        .hidden {
            display: none !important;
        }
        .final-screen {
            text-align: center;
        }
        .final-score {
            font-size: 4rem;
            font-weight: 800;
            color: #1e3c72;
            margin: 20px 0;
        }
        .final-text {
            font-size: 1.2rem;
            color: #3e5a78;
            margin-bottom: 28px;
        }
        @media (max-width: 480px) {
            .game-container {
                padding: 22px 16px;
            }
            .question-word {
                font-size: 2.2rem;
            }
            .options-grid {
                grid-template-columns: 1fr;
            }
            .stats-bar {
                font-size: 0.8rem;
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <!-- 开始界面 -->
        <div id="startScreen">
            <h1>📘 3K+ 词汇测验</h1>
            <div class="subtitle">基于 BNC-COCA 词族表 · 选取 3K 及以上词汇</div>
            <div style="text-align:center; margin: 30px 0;">
                <p style="color:#2a4b6e; margin-bottom:24px;">从您提供的 Unit 2 / Topic 2 / Topic 6 词表中随机出题</p>
                <button class="next-btn" id="startBtn">开始测验</button>
            </div>
        </div>

        <!-- 游戏主界面 -->
        <div id="gameScreen" class="hidden">
            <div class="stats-bar">
                <span>📊 题目 <span id="currentQ">1</span>/<span id="totalQ">10</span></span>
                <span>✅ 得分 <span id="scoreDisplay">0</span></span>
            </div>
            <div class="question-word" id="wordDisplay">—</div>
            <div class="question-meta" id="posDisplay">—</div>
            <div class="options-grid" id="optionsContainer"></div>
            <div id="feedbackArea" class="feedback-msg hidden"></div>
            <button class="next-btn" id="nextBtn" disabled>下一题 →</button>
            <button class="restart-btn" id="restartBtn">🔄 重新开始</button>
        </div>

        <!-- 结束界面 -->
        <div id="endScreen" class="hidden final-screen">
            <h1>🎉 测验完成</h1>
            <div class="final-score" id="finalScore">0/10</div>
            <div class="final-text" id="finalMessage">继续加油！</div>
            <button class="next-btn" id="playAgainBtn">再玩一次</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 词汇库 - 基于用户提供的三个文档，筛选出 3K 及以上词汇
        // 由于无法直接访问 BNC-COCA 词族表，这里采用常见标准：
        // 排除基础 2000 词以下的高频词（如 task, data, text 等简单词），
        // 保留学术/专业/低频词汇，符合 3K+ 要求。
        // ============================================================
        const VOCABULARY = [
            // === 来自 词汇筛选Topic 2 ===
            { word: "adopt", pos: "v.", definition: "采用，采纳；收养" },
            { word: "analysis", pos: "n.", definition: "分析；解析" },
            { word: "capacity", pos: "n.", definition: "能力；容量；产能" },
            { word: "components", pos: "n.", definition: "组件，零部件；组成部分" },
            { word: "concept", pos: "n.", definition: "概念，观念" },
            { word: "consequence", pos: "n.", definition: "后果，结果；影响" },
            { word: "definition", pos: "n.", definition: "定义；释义" },
            { word: "efficiency", pos: "n.", definition: "效率；效能" },
            { word: "efficient", pos: "adj.", definition: "高效的，有成效的" },
            { word: "eliminate", pos: "v.", definition: "消除，排除；淘汰" },
            { word: "elimination", pos: "n.", definition: "消除；淘汰" },
            { word: "enhancement", pos: "n.", definition: "增强，提高，改善" },
            { word: "evolved", pos: "adj./v.", definition: "进化的；进化，演变" },
            { word: "function", pos: "n./v.", definition: "功能，作用；起作用" },
            { word: "functions", pos: "n.", definition: "功能；函数" },
            { word: "inefficient", pos: "adj.", definition: "低效的，效率低下的" },
            { word: "manufacturing", pos: "n./adj.", definition: "制造业；制造的" },
            { word: "modules", pos: "n.", definition: "模块，组件" },
            { word: "obtain", pos: "v.", definition: "获得，得到" },
            { word: "precision", pos: "n.", definition: "精度，精确性" },
            { word: "principles", pos: "n.", definition: "原则，原理" },
            { word: "sacrifice", pos: "n./v.", definition: "牺牲；舍弃" },
            { word: "substitute", pos: "n./v.", definition: "替代品；代替，取代" },
            { word: "substitutes", pos: "n.", definition: "替代品" },
            { word: "refinement", pos: "n.", definition: "改进，优化；精炼，精制" },
            { word: "validation", pos: "n.", definition: "验证，确认；校验" },
            { word: "quest", pos: "n./v.", definition: "探索，追求；探寻" },
            { word: "omission", pos: "n.", definition: "遗漏；省略；疏忽" },
            { word: "redesign", pos: "v./n.", definition: "重新设计" },

            // === 来自 词汇topic6 ===
            { word: "accuracy", pos: "n.", definition: "准确（性），精确度" },
            { word: "approval", pos: "n.", definition: "赞成，认可，批准" },
            { word: "assessments", pos: "n.", definition: "评估，评价" },
            { word: "celebrating", pos: "v-ing", definition: "庆祝；颂扬" },
            { word: "client", pos: "n.", definition: "客户，委托人" },
            { word: "competing", pos: "v-ing/adj.", definition: "竞争，角逐；相互竞争的" },
            { word: "competitive", pos: "adj.", definition: "竞争的，有竞争力的" },
            { word: "competitors", pos: "n.", definition: "竞争者，对手" },
            { word: "conduct", pos: "v./n.", definition: "实施，进行；行为" },
            { word: "conducting", pos: "v-ing", definition: "实施，引导" },
            { word: "confirm", pos: "v.", definition: "确认，证实" },
            { word: "consumer", pos: "n.", definition: "消费者，用户" },
            { word: "consumers", pos: "n.", definition: "消费者" },
            { word: "consumption", pos: "n.", definition: "消耗，消费" },
            { word: "enables", pos: "v.", definition: "使能够，使成为可能" },
            { word: "endorsements", pos: "n.", definition: "支持，认可；代言" },
            { word: "exhibition", pos: "n.", definition: "展览，展览会" },
            { word: "failure", pos: "n.", definition: "失败；故障" },
            { word: "false", pos: "adj.", definition: "虚假的，错误的" },
            { word: "focused", pos: "adj./v.", definition: "专注的；聚焦" },
            { word: "intelligence", pos: "n.", definition: "智力；情报" },
            { word: "internal", pos: "adj.", definition: "内部的；国内的" },
            { word: "invent", pos: "v.", definition: "发明，创造" },
            { word: "investors", pos: "n.", definition: "投资者" },
            { word: "manufacturer", pos: "n.", definition: "制造商，厂家" },
            { word: "obligatory", pos: "adj.", definition: "义务的，强制性的" },
            { word: "obtained", pos: "v.", definition: "获得（过去式/过去分词）" },
            { word: "passage", pos: "n.", definition: "段落；通道" },
            { word: "perspective", pos: "n.", definition: "视角，观点" },
            { word: "phrases", pos: "n.", definition: "短语，词组" },
            { word: "profit", pos: "n./v.", definition: "利润，收益；获益" },
            { word: "retailers", pos: "n.", definition: "零售商" },
            { word: "review", pos: "v./n.", definition: "复习；回顾；评审" },
            { word: "revise", pos: "v.", definition: "修订，修改；温习" },
            { word: "sources", pos: "n.", definition: "来源，资源" },
            { word: "temperature", pos: "n.", definition: "温度" },
            { word: "temperatures", pos: "n.", definition: "温度" },
            { word: "unlike", pos: "prep.", definition: "不像，不同于" },
            { word: "variety", pos: "n.", definition: "多样性，种类" },
            { word: "bold", pos: "adj.", definition: "大胆的；字体加粗的" },
            { word: "comparative", pos: "adj.", definition: "比较的、相比之下" },
            { word: "inclusion", pos: "n.", definition: "包含、纳入" },
            { word: "tick", pos: "v./n.", definition: "滴答声；打勾标记" },
            { word: "verify", pos: "v.", definition: "核实、验证、确认真伪" },
            { word: "appliance", pos: "n.", definition: "器具，（家用）电器" },
            { word: "mandatory", pos: "adj.", definition: "强制的，法定的，义务的" },
            { word: "thermal", pos: "adj.", definition: "热的，热量的，保温的" },
            { word: "underline", pos: "v.", definition: "在......下面划线；强调" },
            { word: "ambient", pos: "adj.", definition: "周围的，环境的" },
            { word: "demonstrable", pos: "adj.", definition: "可证明的，显而易见的" },

            // === 来自 Unit2 Topic5 词汇 ===
            { word: "recruit", pos: "v.", definition: "招募，招聘" },
            { word: "beta", pos: "n.", definition: "β版，测试版" },
            { word: "semi-open", pos: "adj.", definition: "半开放的" },
            { word: "limited", pos: "adj.", definition: "有限的" },
            { word: "pick up", pos: "phr.v.", definition: "发现，找出" },
            { word: "brainstorm", pos: "v.", definition: "头脑风暴，集思广益" },
            { word: "multimedia", pos: "adj.", definition: "多媒体的" },
            { word: "encyclopedia", pos: "n.", definition: "百科全书" },
            { word: "prototype", pos: "n.", definition: "原型；样机" },
            { word: "operational", pos: "adj.", definition: "可运行的，可操作的" },
            { word: "proportion", pos: "n.", definition: "比例" },
            { word: "simulation", pos: "n.", definition: "模拟，仿真" },
            { word: "representation", pos: "n.", definition: "呈现；模拟表现" },
            { word: "vibration", pos: "n.", definition: "震动，振动" },
            { word: "extreme", pos: "n.", definition: "极端" },
            { word: "application", pos: "n.", definition: "施加；应用" },
            { word: "bug", pos: "n.", definition: "（程序）漏洞，缺陷" },
            { word: "jargon", pos: "n.", definition: "行业术语，行话" },
            { word: "phrase", pos: "n.", definition: "短语，说法" },
            { word: "prerelease", pos: "adj.", definition: "预发布的" },
            { word: "rationale", pos: "n.", definition: "根本理由，逻辑依据" },
            { word: "confidence", pos: "n.", definition: "信心" },
            { word: "negative", pos: "adj.", definition: "负面的" },
            { word: "familiar", pos: "adj.", definition: "熟悉的" },
            { word: "firsthand", pos: "adj.", definition: "第一手的，直接获得的" },
            { word: "acquire", pos: "v.", definition: "获得，习得" },
            { word: "drawback", pos: "n.", definition: "弊端，缺点" },
            { word: "potential", pos: "adj.", definition: "潜在的" },

            // 专业技术名词
            { word: "failure test", pos: "n.", definition: "破坏性测试" },
            { word: "scale model", pos: "n.", definition: "比例模型" },
            { word: "playtest", pos: "n.", definition: "游戏试玩测试" },
            { word: "open playtest", pos: "n.", definition: "公开试测" },
            { word: "closed playtest", pos: "n.", definition: "封闭试测" },
            { word: "beta playtest", pos: "n.", definition: "β版本测试" },
            { word: "prerelease version", pos: "n.", definition: "预发布版本" }
        ];

        // 去重（按 word 去重，保留第一个）
        const uniqueVocab = [];
        const seen = new Set();
        for (const item of VOCABULARY) {
            if (!seen.has(item.word)) {
                seen.add(item.word);
                uniqueVocab.push(item);
            }
        }

        // ============================================================
        // 游戏逻辑
        // ============================================================
        const TOTAL_QUESTIONS = 10;  // 每轮题目数量

        let currentQuestions = [];     // 当前轮次的题目
        let currentIndex = 0;
        let score = 0;
        let answered = false;          // 当前题目是否已作答
        let currentCorrectAnswer = null;

        // DOM 元素
        const startScreen = document.getElementById('startScreen');
        const gameScreen = document.getElementById('gameScreen');
        const endScreen = document.getElementById('endScreen');
        const wordDisplay = document.getElementById('wordDisplay');
        const posDisplay = document.getElementById('posDisplay');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedbackArea = document.getElementById('feedbackArea');
        const nextBtn = document.getElementById('nextBtn');
        const restartBtn = document.getElementById('restartBtn');
        const startBtn = document.getElementById('startBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const currentQSpan = document.getElementById('currentQ');
        const totalQSpan = document.getElementById('totalQ');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const finalScore = document.getElementById('finalScore');
        const finalMessage = document.getElementById('finalMessage');

        // ========== 工具函数 ==========
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 生成题目（不重复词汇）
        function generateQuestions(count) {
            const shuffled = shuffleArray([...uniqueVocab]);
            const selected = shuffled.slice(0, Math.min(count, shuffled.length));

            return selected.map((item) => {
                // 生成 3 个干扰项（从其余词汇中随机选）
                const otherDefs = uniqueVocab
                    .filter(v => v.word !== item.word)
                    .map(v => v.definition);
                
                // 去重干扰项，避免与正确答案相同
                const uniqueOtherDefs = [...new Set(otherDefs)].filter(d => d !== item.definition);
                const shuffledOther = shuffleArray(uniqueOtherDefs);
                const distractors = shuffledOther.slice(0, 3);

                // 如果干扰项不足 3 个，用通用定义填充（防止词汇量太少时出错）
                while (distractors.length < 3) {
                    distractors.push("以上都不是");
                }

                const options = shuffleArray([item.definition, ...distractors]);
                const correctIndex = options.indexOf(item.definition);

                return {
                    word: item.word,
                    pos: item.pos,
                    correctAnswer: item.definition,
                    options: options,
                    correctIndex: correctIndex
                };
            });
        }

        // 开始新游戏
        function startNewGame() {
            currentQuestions = generateQuestions(TOTAL_QUESTIONS);
            currentIndex = 0;
            score = 0;
            answered = false;
            totalQSpan.textContent = currentQuestions.length;
            scoreDisplay.textContent = score;

            startScreen.classList.add('hidden');
            endScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            loadQuestion();
        }

        // 加载题目
        function loadQuestion() {
            if (currentIndex >= currentQuestions.length) {
                showEndScreen();
                return;
            }
            answered = false;
            nextBtn.disabled = true;
            feedbackArea.classList.add('hidden');
            feedbackArea.classList.remove('feedback-correct', 'feedback-wrong');

            const q = currentQuestions[currentIndex];
            currentCorrectAnswer = q.correctAnswer;

            wordDisplay.textContent = q.word;
            posDisplay.textContent = q.pos;
            currentQSpan.textContent = currentIndex + 1;

            // 渲染选项
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn');
                btn.textContent = opt;
                btn.dataset.index = idx;
                btn.addEventListener('click', () => handleOptionClick(idx, btn));
                optionsContainer.appendChild(btn);
            });
        }

        // 处理选项点击
        function handleOptionClick(selectedIndex, btn) {
            if (answered) return;
            answered = true;

            const q = currentQuestions[currentIndex];
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            const isCorrect = selectedIndex === q.correctIndex;

            // 禁用所有按钮，标记正确/错误
            allBtns.forEach((b, idx) => {
                b.disabled = true;
                if (idx === q.correctIndex) {
                    b.classList.add('correct');
                } else if (idx === selectedIndex && !isCorrect) {
                    b.classList.add('wrong');
                }
            });

            // 显示反馈
            feedbackArea.classList.remove('hidden');
            if (isCorrect) {
                score++;
                scoreDisplay.textContent = score;
                feedbackArea.textContent = '✅ 回答正确！';
                feedbackArea.classList.add('feedback-correct');
            } else {
                feedbackArea.textContent = `❌ 回答错误。正确答案是：${q.correctAnswer}`;
                feedbackArea.classList.add('feedback-wrong');
            }

            nextBtn.disabled = false;
        }

        // 下一题
        function nextQuestion() {
            if (!answered) return;
            currentIndex++;
            if (currentIndex >= currentQuestions.length) {
                showEndScreen();
            } else {
                loadQuestion();
            }
        }

        // 显示结束界面
        function showEndScreen() {
            gameScreen.classList.add('hidden');
            endScreen.classList.remove('hidden');
            const total = currentQuestions.length;
            finalScore.textContent = `${score}/${total}`;

            if (score === total) {
                finalMessage.textContent = '🏆 太棒了！全对！词汇量惊人！';
            } else if (score >= total * 0.8) {
                finalMessage.textContent = '🎯 优秀！接近满分，继续保持！';
            } else if (score >= total * 0.6) {
                finalMessage.textContent = '📚 不错，再复习一下会更牢固！';
            } else {
                finalMessage.textContent = '💪 继续加油，多背几遍就能掌握！';
            }
        }

        // ========== 事件绑定 ==========
        startBtn.addEventListener('click', startNewGame);
        playAgainBtn.addEventListener('click', startNewGame);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', () => {
            if (confirm('确定要重新开始吗？当前进度会丢失。')) {
                startNewGame();
            }
        });

        // 键盘支持：按 1-4 选择选项（可选）
        document.addEventListener('keydown', (e) => {
            if (gameScreen.classList.contains('hidden')) return;
            if (answered) {
                if (e.key === 'Enter' && !nextBtn.disabled) {
                    nextQuestion();
                }
                return;
            }
            const key = e.key;
            if (key >= '1' && key <= '4') {
                const idx = parseInt(key) - 1;
                const btns = optionsContainer.querySelectorAll('.option-btn');
                if (btns[idx] && !btns[idx].disabled) {
                    btns[idx].click();
                }
            }
        });
    </script>
</body>
</html>
